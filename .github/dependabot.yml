version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      gui-stack:
        patterns: ["egui*", "eframe", "wgpu*", "winit*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
