[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
  # "unmaintained" notices for transitive GUI dependencies (ttf-parser via ab_glyph/egui text stack, zbus/zvariant via the rfd XDG portal).
  # No security vulnerability is reported; revisit when upstream crates migrate.
  "RUSTSEC-2026-0192",
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "OFL-1.1", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0",
  "LicenseRef-UFL-1.0", "NCSA", "OpenSSL", "MIT-0", "Ubuntu-font-1.0", "LGPL-2.1-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

